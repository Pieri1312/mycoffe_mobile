name: MyCoffe Android

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mycoffe-android.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mycoffe-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: dart tool/setup.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build demonstration APK
        run: flutter build apk --debug
      - name: Upload demonstration APK
        uses: actions/upload-artifact@v4
        with:
          name: MyCoffe-Android-demo
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
